name: 公営住宅倍率の再生成

# 月1回（毎月1日 06:00 JST）＋手動実行。
# data/koei-jutaku.json をもとに記事の倍率表を再描画し、差分があればコミットする器。
# ※ 各自治体の募集結果PDF/HTMLは形式がバラバラなため、当面はJSONを手/半自動で更新→本ジョブで反映。
#    機械可読ソースが増えたら tools/build_koei.py の collect() にスクレイパを追加する。

on:
  schedule:
    - cron: "0 21 1 * *"   # 毎月1日 21:00 UTC = 翌 06:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 倍率表を再生成
        run: python tools/build_koei.py
      - name: 都市別ページを再生成
        run: python tools/build_koei_cities.py
      - name: 団地別ランキングを再生成
        run: python tools/build_koei_danchi.py
      # ★2026-09-17 python の描画のあとに node を通す。
      #   build_koei_cities.py は data/koei-cities.json から koei-tokyo.html を作り直すので、
      #   scripts/stamp-offers.mjs が貼った売り場カードが毎月ここで剥がれていた（実測で0個になる）。
      #   貼り直しは倍率表の生データ（.gitignore 済み）を要らないので、CIでも回せる。
      #   [[deploy-gate-after-generators]]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 売り場カードを貼り直す
        run: node scripts/stamp-offers.mjs
      - name: 都営の面を検査する（落ちたらコミットしない）
        run: node scripts/toei-check.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/koei-jutaku-bairitsu.html articles/koei-danchi-ranking.html data/koei-jutaku.json data/koei-cities.json data/koei-bairitsu.csv data/koei-danchi.csv articles/koei-sapporo.html articles/koei-yokohama.html articles/koei-chiba.html articles/koei-kobe.html articles/koei-saitama.html articles/koei-kyoto.html articles/koei-kawasaki.html articles/koei-sendai.html articles/koei-tokyo.html articles/koei-osaka.html articles/koei-nagoya.html articles/koei-fukuoka.html sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 公営住宅倍率を再生成 [skip ci]"
            git pull --rebase -X theirs origin ${{ github.ref_name }} || true
            git push || { git pull --rebase -X theirs origin ${{ github.ref_name }}; git push; }
          fi
