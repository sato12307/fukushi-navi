name: Deploy site to Pages

# 旧式のブランチ配信(pages-build-deployment)が deployment_queued のまま
# タイムアウトする不具合を回避するため、モダンな actions/deploy-pages で配信する。
# 同時実行を1本に絞り(グループ pages)、確実に最新を publish する。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1本に絞るが、走行中のデプロイは最後まで完走させる（途中キャンセルは
# Pagesバックエンドをwedgeさせ "Deployment failed, try again later" を誘発するため false）。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # AdSense の読み込みタグを全ページの <head> に入れる（2026-09-28）。ページを書く生成器が12か所あり、
      # 月次の Actions も面を作り直すので、公開の直前のここ1か所で入れる（理由は scripts/stamp-adsense.mjs の冒頭）。
      - name: Stamp AdSense tag
        run: node scripts/stamp-adsense.mjs
      # 量産の面（市区町村・都道府県ごとの型の面）を Google にだけ noindex にし、Google 用の sitemap-google.xml を作る（2026-10-02）。
      #   Bing には全部入りの sitemap.xml と IndexNow で見せたまま（理由は scripts/stamp-google-noindex.mjs の冒頭）。
      - name: Google-only noindex for bulk pages
        run: node scripts/stamp-google-noindex.mjs
      - name: Upload artifact (site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
      - name: IndexNow ping (Bing/Yandex 即時インデックス通知)
        run: node scripts/indexnow.mjs || true
