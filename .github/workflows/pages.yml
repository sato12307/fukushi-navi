name: Deploy site to Pages

# 旧式のブランチ配信(pages-build-deployment)が deployment_queued のまま
# タイムアウトする不具合を回避するため、モダンな actions/deploy-pages で配信する。
# 同時実行を1本に絞り(グループ pages)、確実に最新を publish する。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1本に絞るが、走行中のデプロイは最後まで完走させる（途中キャンセルは
# Pagesバックエンドをwedgeさせ "Deployment failed, try again later" を誘発するため false）。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, home-linux]   # 2026-10-25 ミニPC（WSL Ubuntu）の self-hosted runner に一本化
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # 記事と計算機の一覧（/articles/）を、いまある記事から作り直す（2026-10-11）。記事を足した日に手元で回し忘れても本番は最新になる。
      #   sitemap.xml に /articles/ の行も入れるので、下の Google 用サイトマップより先に回す。
      - name: Build the article index
        run: node scripts/articles-index.mjs
      # AdSense の読み込みタグを全ページの <head> に入れる（2026-09-28）。ページを書く生成器が12か所あり、
      # 月次の Actions も面を作り直すので、公開の直前のここ1か所で入れる（理由は scripts/stamp-adsense.mjs の冒頭）。
      #   2026-10-11 から型の面には入れず、robots.txt で AdSense のクローラ（Mediapartners-Google）に型の面を見せない。
      - name: Stamp AdSense tag
        run: node scripts/stamp-adsense.mjs
      # アフィリエイト（A8.net）のバナーを、来訪の多い記事の決めた位置に入れる（2026-10-19）。
      #   この記事には部分を書き換える台本が多くかかるので、AdSense と同じく公開の直前に入れる（理由は scripts/stamp-affiliate.mjs の冒頭）。
      - name: Stamp affiliate banners
        run: node scripts/stamp-affiliate.mjs
      # 量産の面（市区町村・都道府県ごとの型の面）を Google にだけ noindex にし、Google 用の sitemap-google.xml を作る（2026-10-02）。
      #   Bing には全部入りの sitemap.xml と IndexNow で見せたまま（理由は scripts/stamp-google-noindex.mjs の冒頭）。
      - name: Google-only noindex for bulk pages
        run: node scripts/stamp-google-noindex.mjs
      # 全ページの上部メニューとロゴの添え書きを1つにそろえる（2026-10-11・生成器ごとに13通りに割れていた）
      - name: Unify the site menu
        run: node scripts/stamp-site-nav.mjs
      # 公開するファイルだけを _site に集める（2026-10-11）。それまではリポジトリの根をそのまま公開しており、
      #   README.md（立ち上げ時の作業メモ）・scripts/・tools/・indexnow.env まで誰でも開けた。
      #   data/ は記事からダウンロードのリンクを張っている（CSV・JSON）ので公開のまま。IndexNow の鍵のファイル（<鍵>.txt）も残す。
      - name: Assemble the public files
        run: |
          rsync -a --exclude='.*' --exclude='/_site/' --exclude='/scripts/' --exclude='/tools/' \
            --exclude='*.md' --exclude='*.py' --exclude='__pycache__/' --exclude='/indexnow.env' ./ _site/
          test -f _site/index.html && test -f _site/404.html && test -f _site/robots.txt && test -f _site/ads.txt
          test ! -e _site/README.md && test ! -e _site/scripts
          echo "公開するファイル：$(find _site -type f | wc -l)"
      - name: Upload artifact (public files only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
      - name: IndexNow ping (Bing/Yandex 即時インデックス通知)
        run: node scripts/indexnow.mjs || true
