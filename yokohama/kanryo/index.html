  <h1>ご購入ありがとうございます</h1>
  <p class="lead">資料はこの画面にそのまま開きます。購入から60日間は、このURLで何度でも開けます（ブックマークしておいてください）。</p>
  <p class="buyrow"><a class="btn-primary" id="dl" href="#">資料を開く</a></p>
  <noscript><p class="fine">この画面は、ブラウザの JavaScript を使って資料を開きます。無効になっていると開けません。有効にして読み込み直すか、<a href="mailto:contact@fukushiru.com">contact@fukushiru.com</a> までご連絡ください（購入時のメールアドレスを添えていただけると照合できます）。</p></noscript>
  <p class="fine">うまく開けない・中身が説明と違う場合は、購入から14日以内に contact@fukushiru.com までご連絡ください。全額返金します。</p>
  <p id="msg" class="fine"></p>
  <script>
(function () {
  var sid = new URLSearchParams(location.search).get('session_id')
  var a = document.getElementById('dl')
  var m = document.getElementById('msg')
  if (!a) return
  if (!m) { m = document.createElement('p'); m.id = 'msg'; m.className = 'fine'; a.parentNode.insertBefore(m, a.nextSibling) }
  var show = function (t) { m.textContent = t }
  var hide = function () { a.style.display = 'none' }
  var api = function (q) { return '/api/pack?session_id=' + encodeURIComponent(sid) + q }

  if (!sid) { hide(); show('購入の情報が見つかりません。購入後に表示されたURLからお越しください。'); return }

  // 資料をこの画面の中に開く。
  var mounted = false
  var mount = function () {
    if (mounted) return
    mounted = true
    // 予備ボタンがあった場所（＝押すはずだった所）には、操作だけを置く。
    var host = (a.parentNode && a.parentNode.tagName === 'P') ? a.parentNode : a
    var bar = document.createElement('p')
    bar.className = 'fine'
    bar.style.cssText = 'display:flex;gap:1.2rem;flex-wrap:wrap;margin:.6rem 0'
    var jump = document.createElement('a')
    jump.href = '#packview'; jump.textContent = '↓ 申込先えらびの資料はこのページの下に開いています'
    jump.style.cssText = 'font-weight:600'
    var dl = document.createElement('a')
    dl.href = api('&dl=1'); dl.textContent = 'ファイルとして保存（HTML）'; dl.setAttribute('download', '')
    var tab = document.createElement('a')
    tab.href = api(''); tab.target = '_blank'; tab.rel = 'noopener'; tab.textContent = '別のタブで開く'
    bar.appendChild(jump); bar.appendChild(dl); bar.appendChild(tab)
    host.parentNode.insertBefore(bar, host.nextSibling)

    // 資料そのものは、この画面の一番下に開く。
    var box = document.createElement('div')
    box.id = 'packview'
    box.style.cssText = 'margin:1.6rem 0 0;scroll-margin-top:1rem'

    var f = document.createElement('iframe')
    f.src = api('')
    f.title = '申込先えらびの資料'
    // 高さが測れなかったときのために既定値を置く（測れなければ二重スクロールになるが読める）
    f.style.cssText = 'display:block;width:100%;height:70vh;border:1px solid #dfe4ea;border-radius:4px;background:#fff'

    // ★測るのは body の高さだけ（2026-09-22）。
    //   documentElement.scrollHeight は「中身の高さ」ではなく**最低でも中の窓の高さ**を返す。
    //   iframe を伸ばすと中の窓も伸びるので、一度伸ばしたあとは同じ値しか返らなくなり、
    //   **縮められなくなる**。端末を横向きにして本文が短くなると、その差がまるごと
    //   空白として下に残る。body の高さは中身で決まるので、伸びも縮みも追える。
    var fit = function () {
      try {
        var d = f.contentDocument
        if (!d) return
        var h = (d.body && d.body.scrollHeight) || (d.documentElement && d.documentElement.scrollHeight) || 0
        if (h > 0) f.style.height = (h + 24) + 'px'
      } catch (e) { /* 測れないときは既定の高さのまま */ }
    }
    // 向きを変えるたびに何十回も測らない（1回の変化で1度だけ測る）
    var fitTimer = null
    var fitSoon = function () { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 120) }
    f.addEventListener('load', function () {
      fit()
      // 表の組み直しや字形の確定で高さが動く。数回だけ測り直す。
      setTimeout(fit, 300); setTimeout(fit, 1200)
      try {
        if (window.ResizeObserver && f.contentDocument && f.contentDocument.body) {
          new ResizeObserver(fitSoon).observe(f.contentDocument.body)
        }
      } catch (e) {}
    })
    window.addEventListener('resize', fitSoon)
    window.addEventListener('orientationchange', fitSoon)

    box.appendChild(f)
    host.parentNode.appendChild(box)
  }

  hide()
  show('購入を確認しています…')
  var tries = 0
  var ask = function () {
    tries++
    fetch(api('&check=1'), { cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return { ok: false } }) })
      .then(function (d) {
        if (d && d.ok) { show(''); mount(); return }
        // 受領の確認待ち（PayPay など別画面から戻る方法で起きる）。数回だけ聞き直す。
        if (d && d.retry && tries < 6) {
          show('お支払いの確認を待っています…（' + tries + '回目）')
          setTimeout(ask, 3000)
          return
        }
        show((d && d.error) || '購入の確認ができませんでした。お手数ですが contact@fukushiru.com までご連絡ください（この画面のURLを添えていただけると早いです）。')
      })
      .catch(function () {
        if (tries < 3) { setTimeout(ask, 3000); return }
        // 通信そのものが通らないときは、予備ボタンだけでも出す（読める人を止めない）。
        a.href = api('')
        a.textContent = '申込先えらびの資料を開く'
        a.style.display = ''
        show('確認の通信に失敗しました。上のボタンをお試しください。開けない場合は contact@fukushiru.com までご連絡ください。')
      })
  }
  ask()
})()
</script>

<script>
/* 購入までの段を数える。どこで人が落ちているかが分からないと、
   「売れない＝価格が高い」と決めつけて打つ手を全部間違える。
   数えるのは押された回数だけで、誰が押したかは記録しない。
   ★リンクの計測は sendBeacon を使う。fetch だと遷移で中断されて落ちる。
   ★この判定はここ1か所だけに置く。生成ページは build 時にこのファイルを読んで埋め込み、
     手書きの記事は script の src で読む。2か所に書くと必ずずれる。[[same-question-two-implementations]]
   ★2026-09-08 自分の閲覧を数えない判定もここに入れた。
     確認のために自分で開いた回数が混ざると、「見られている／押されている」の判断を丸ごと誤る。
     https://fukushiru.com/?self=1 を一度開けばこの端末は以後ずっと除外される（#self でも同じ）。
     戻すときは localStorage.removeItem('ev_off')。
     イベント名は [a-z_] だけにすること。worker 側が数字を落とすので pack2 は pack になる。 */
(function () {
  // 自分で立てた印。localStorage が使えない環境（プライベートウィンドウ等）でも計測は続ける。
  try {
    if (/[?&]self=1(?:&|$)/.test(location.search) || location.hash === '#self') localStorage.setItem('ev_off', '1')
  } catch (e) { /* 保存できなくても本文は動かす */ }

  // 送らない相手＝自分の端末と、自動で開いているブラウザ（ヘッドレス巡回）。
  function off() {
    try { if (localStorage.getItem('ev_off') === '1') return true } catch (e) { /* 読めなければ除外しない */ }
    return navigator.webdriver === true
  }

  function ev(n) {
    if (off()) return
    try {
      var b = JSON.stringify({ n: n })
      if (navigator.sendBeacon) { navigator.sendBeacon('/api/ev', new Blob([b], { type: 'application/json' })); return }
      fetch('/api/ev', { method: 'POST', headers: { 'content-type': 'application/json' }, body: b, keepalive: true })
    } catch (e) { /* 計測の失敗でページを壊さない */ }
  }
  window.__ev = ev
  // 売り場ごとに名前を分ける。同じ名前にすると、どちらが動いたのか後から分けられない。
  var SELL = [
    { path: '/pack/', view: 'pack_view', click: 'to_pack' },   // 障害者控除の還付申請パック
    { path: '/toei/', view: 'toei_view', click: 'to_toei' },   // 都営住宅の申込先えらび
    // ★政令市5市（2026-09-20 追加）。売り場を /<市>/moushikomisaki/ へ切り出した 2026-09-19 に
    //   ここへの登録が漏れ、<市>_view が一度も撃たれていなかった。盤面では決済だけが立ち、
    //   手前の段が全部0に見えていた（数字が無いのであって、0ではない）。
    // ★買う押（<市>_leaf_buy）は assets/buy.js 側にあり、data-offer とともに動いている。
    // ★click は置かない。政令市の段は view → buy → pay で、押した段が初めから無い
    //   （tools/buy-funnel-ships.mjs もそう定義している）。読まない名前を撃つと孤児のキーが増える。
    { path: '/kawasaki/moushikomisaki/', view: 'kawasaki_view' },
    { path: '/shizuoka/moushikomisaki/', view: 'shizuoka_view' },
    { path: '/yokohama/moushikomisaki/', view: 'yokohama_view' },
    { path: '/kobe/moushikomisaki/', view: 'kobe_view' },
    { path: '/sagamihara/moushikomisaki/', view: 'sagamihara_view' }
  ]
  for (var i = 0; i < SELL.length; i++) {
    if (location.pathname.indexOf(SELL[i].path) === 0 && location.pathname.indexOf('kanryo') < 0) ev(SELL[i].view)
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null
    if (!a) return
    var h = a.getAttribute('href') || ''
    if (h.indexOf('kanryo') >= 0) return
    for (var j = 0; j < SELL.length; j++) {
      if (h.indexOf(SELL[j].path) >= 0) { if (SELL[j].click) ev(SELL[j].click); return }
    }
  }, true)
})();
</script>
